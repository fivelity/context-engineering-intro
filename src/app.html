<!DOCTYPE html>
<html lang="en" class="%sveltekit.theme%">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.png" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>SenseCanvas - PC Sensor Dashboard</title>
		<meta name="description" content="Hyper-customizable PC sensor dashboard with real-time monitoring and AI-powered layout suggestions" />
		
		<!-- Theme CSS Variables -->
		<style>
			:root {
				/* Light theme variables */
				--theme-bg-primary: #ffffff;
				--theme-bg-secondary: #f8fafc;
				--theme-text-primary: #0f172a;
				--theme-text-secondary: #64748b;
				--theme-border-primary: #e2e8f0;
				--theme-accent-primary: #3b82f6;
				--theme-accent-secondary: #06b6d4;
				
				/* Sensor color schemes */
				--sensor-thermal-low: #22c55e;
				--sensor-thermal-medium: #eab308;
				--sensor-thermal-high: #ef4444;
				--sensor-performance-low: #06b6d4;
				--sensor-performance-medium: #3b82f6;
				--sensor-performance-high: #8b5cf6;
			}
			
			:root[data-theme='dark'] {
				/* Dark theme variables */
				--theme-bg-primary: #0f172a;
				--theme-bg-secondary: #1e293b;
				--theme-text-primary: #f1f5f9;
				--theme-text-secondary: #94a3b8;
				--theme-border-primary: #334155;
				--theme-accent-primary: #60a5fa;
				--theme-accent-secondary: #22d3ee;
			}
			
			body {
				background-color: var(--theme-bg-primary);
				color: var(--theme-text-primary);
				font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
			}
		</style>
		
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover" data-theme="skeleton">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
