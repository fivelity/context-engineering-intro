<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%sveltekit.assets%/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="SenseCanvas - Futuristic PC Hardware Monitoring Dashboard" />
    <meta name="keywords" content="hardware monitoring, PC dashboard, real-time metrics, cyberpunk UI, gaming dashboard" />
    <meta name="author" content="SenseCanvas Team" />
    
    <!-- Theme color for mobile browsers -->
    <meta name="theme-color" content="#00ffff" />
    
    <!-- Open Graph meta tags -->
    <meta property="og:title" content="SenseCanvas - PC Hardware Monitoring Dashboard" />
    <meta property="og:description" content="Real-time hardware monitoring with futuristic sci-fi aesthetics" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="%sveltekit.assets%/og-image.png" />
    
    <!-- Preconnect to external domains for performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    
    <!-- Prevent FOUC (Flash of Unstyled Content) -->
    <style>
      /* Critical CSS for initial page load */
      body {
        margin: 0;
        padding: 0;
        background: #0a0a0a;
        color: white;
        font-family: 'JetBrains Mono', monospace;
        overflow-x: hidden;
      }
      
      /* Loading screen */
      .initial-loader {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: linear-gradient(135deg, #0a0a0a 0%, #1a1a1a 100%);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        transition: opacity 0.5s ease-out;
      }
      
      .loader-content {
        text-align: center;
        color: #00ffff;
      }
      
      .loader-spinner {
        width: 40px;
        height: 40px;
        border: 3px solid rgba(0, 255, 255, 0.3);
        border-top: 3px solid #00ffff;
        border-radius: 50%;
        animation: spin 1s linear infinite;
        margin: 0 auto 20px;
      }
      
      .loader-text {
        font-size: 18px;
        font-weight: 500;
        letter-spacing: 2px;
        animation: pulse 2s ease-in-out infinite;
      }
      
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      
      @keyframes pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.5; }
      }
      
      /* Hide loader when app is ready */
      .app-ready .initial-loader {
        opacity: 0;
        pointer-events: none;
      }
    </style>
    
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover" class="antialiased">
    <!-- Initial loading screen -->
    <div class="initial-loader" id="initial-loader">
      <div class="loader-content">
        <div class="loader-spinner"></div>
        <div class="loader-text">INITIALIZING SENSECANVAS</div>
      </div>
    </div>
    
    <!-- Main application container -->
    <div style="display: contents" id="svelte-app">%sveltekit.body%</div>
    
    <!-- Remove loader when app is ready -->
    <script>
      // Remove initial loader when DOM is loaded
      document.addEventListener('DOMContentLoaded', function() {
        setTimeout(() => {
          document.body.classList.add('app-ready');
          setTimeout(() => {
            const loader = document.getElementById('initial-loader');
            if (loader) {
              loader.remove();
            }
          }, 500);
        }, 1000);
      });

    </script>
