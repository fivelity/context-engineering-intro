version: '3.8'

services:
  # SenseCanvas Backend (FastAPI)
  sensecanvas-server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: sensecanvas-server
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ENV=development
      - DEBUG=true
      - HOST=0.0.0.0
      - PORT=8000
      - CORS_ORIGINS=http://localhost:5173,http://localhost:3000
      - DATABASE_URL=sqlite:///./data/sensecanvas.db
      - LOG_LEVEL=INFO
      - HARDWARE_POLLING_INTERVAL_MS=1000
      - WS_MAX_CONNECTIONS=100
    volumes:
      - ./server:/app
      - ./data:/app/data
      - ./logs:/app/logs
      # Mount LibreHardwareMonitor DLL (Windows only)
      - ./server/LibreHardwareMonitorLib.dll:/app/LibreHardwareMonitorLib.dll:ro
    networks:
      - sensecanvas-network
    depends_on:
      - redis
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # SenseCanvas Frontend (SvelteKit)
  sensecanvas-client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: sensecanvas-client
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      - NODE_ENV=development
      - VITE_WEBSOCKET_URL=ws://localhost:8000/ws
      - VITE_API_BASE_URL=http://localhost:8000
    volumes:
      - ./client:/app
      - /app/node_modules
    networks:
      - sensecanvas-network
    depends_on:
      - sensecanvas-server
    command: npm run dev -- --host 0.0.0.0

  # Redis for caching and session management
  redis:
    image: redis:7-alpine
    container_name: sensecanvas-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - sensecanvas-network
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru

  # Prometheus for metrics collection (optional)
  prometheus:
    image: prom/prometheus:latest
    container_name: sensecanvas-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - sensecanvas-network
    profiles:
      - monitoring
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'

  # Grafana for metrics visualization (optional)
  grafana:
    image: grafana/grafana:latest
    container_name: sensecanvas-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=sensecanvas
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    networks:
      - sensecanvas-network
    profiles:
      - monitoring
    depends_on:
      - prometheus

  # Nginx reverse proxy for production
  nginx:
    image: nginx:alpine
    container_name: sensecanvas-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./client/build:/var/www/html:ro
    networks:
      - sensecanvas-network
    profiles:
      - production
    depends_on:
      - sensecanvas-server
      - sensecanvas-client

networks:
  sensecanvas-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

volumes:
  redis-data:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local

# Development override
# Usage: docker-compose -f docker-compose.yml -f docker-compose.dev.yml up
---
# docker-compose.dev.yml (development overrides)
version: '3.8'

services:
  sensecanvas-server:
    build:
      target: development
    environment:
      - ENV=development
      - DEBUG=true
      - DEV_AUTO_RELOAD=true
      - DEV_MOCK_HARDWARE=true
    volumes:
      - ./server:/app
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload

  sensecanvas-client:
    environment:
      - NODE_ENV=development
    volumes:
      - ./client:/app
      - /app/node_modules
    command: npm run dev -- --host 0.0.0.0